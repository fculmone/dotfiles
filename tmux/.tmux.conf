# Francesco's tmux configuration
# Focus: sane mouse selection in split panes, truecolor, and modified-key
# passthrough for full-screen TUIs. Portable across macOS, Linux, and WSL.

# Use a tmux-aware TERM inside panes. Confirmed available via terminfo.
set -g default-terminal "tmux-256color"

# Preserve truecolor in modern terminals, including iTerm2/Ghostty.
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',tmux*:RGB'

# Preserve modified keys like Shift+Enter / Ctrl+Enter for full-screen TUIs.
# Requires tmux 3.5+.
set -g extended-keys on
set -g extended-keys-format csi-u

# Don't swallow ESC — the default 500ms delay shows up as input lag in Neovim.
# Neovim's :checkhealth recommends <= 10ms.
set -sg escape-time 10

# Let Neovim see focus gain/loss, so autoread and autosave behave.
set -g focus-events on

# Count windows and panes from 1; 0 is a long reach on the keyboard.
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers contiguous after closing one.
set -g renumber-windows on

# A 2000-line scrollback is small for build logs.
set -g history-limit 50000

# Enable tmux pane-aware mouse handling. This avoids native terminal selection
# getting confused by vertical splits and full-screen TUIs.
set -g mouse on

# Quick escape hatch: Prefix + m toggles tmux mouse mode.
# Mouse ON  = tmux copy mode selection works per pane.
# Mouse OFF = native iTerm2/Ghostty selection works across the raw screen.
bind-key m if -F '#{mouse}' \
  'set -g mouse off; display-message "tmux mouse: off — native terminal selection"' \
  'set -g mouse on; display-message "tmux mouse: on — pane-aware selection"'

# Vi-style copy mode.
setw -g mode-keys vi

# Clipboard command, resolved per platform at config load.
# Last matching branch wins, so WSL's clip.exe takes priority over xclip.
set -g @copy_cmd 'cat >/dev/null'
if-shell 'command -v xclip   >/dev/null 2>&1' 'set -g @copy_cmd "xclip -selection clipboard"'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -g @copy_cmd "wl-copy"'
if-shell 'command -v pbcopy  >/dev/null 2>&1' 'set -g @copy_cmd "pbcopy"'
if-shell 'command -v clip.exe >/dev/null 2>&1' 'set -g @copy_cmd "clip.exe"'

# Also emit OSC 52 so copying works over SSH and in terminals that support it.
set -g set-clipboard on

# Keyboard copy bindings in copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"

# Mouse drag selection copies on release.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
